<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ארכיון התוכניות — ראש בראש</title>
  <meta name="description" content="כל התוכניות של ראש בראש לפי עונות, עם חיפוש בשירים שהושמעו וקפיצה ישירה לרגע בהקלטה.">
  <meta name="theme-color" content="#06080f">
  <link rel="icon" href="assets/img/medallion.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Karantina:wght@300;400;700&display=swap">
  <link rel="stylesheet" href="assets/css/rosh.css">
</head>
<body>
  <a class="skip-link" href="#main">דילוג לתוכן</a>
  <div class="shell">
    <div id="site-header"></div>
    <main id="main">
      <section class="card">
        <div class="section-title">
          <div><p class="kicker">כל התוכניות</p><h1>הארכיון</h1></div>
          <strong id="count" aria-live="polite">…</strong>
        </div>
        <div class="card-body">
          <form class="search-box" role="search" id="search-form">
            <span class="search-glyph" aria-hidden="true">♫</span>
            <label for="q" class="visually-hidden">חיפוש תוכנית, שיר או זמר</label>
            <input id="q" type="search" placeholder="חפשו תוכנית, שיר או זמר…" autocomplete="off">
            <kbd aria-hidden="true">/</kbd>
          </form>
          <div class="filters" id="filters"></div>
          <section id="song-hits" aria-live="polite"></section>
          <section id="results" aria-live="polite"></section>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
  </div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/player.js"></script>
  <script src="assets/js/archive.js"></script>
  <script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
