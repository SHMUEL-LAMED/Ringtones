name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # פעם ביום: בניית מפת האתר ודפי התוכניות מחדש, כדי שתוכניות חדשות יופיעו בגוגל
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    # שום דבר לא עולה לאוויר אם בדיקה נכשלה
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the saved catalog copy (data/episodes.json) from the live catalog
        run: node scripts/build-saved-catalog.mjs
      - name: Build the sitemap from the live catalog
        run: node scripts/build-sitemap.mjs
      - name: Build a static page per episode (episodes/<slug>.html, for search engines)
        run: node scripts/build-episode-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
